name: Build

on:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: self-hosted

    container:
      image: ${{ vars.DOCKER_REGISTRY }}/godot:4.7.2-stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Export project
        run: |
          rm -rf $HOME/.local/share/godot/ && mkdir -p $HOME/.local/share/godot/
          mv /opt/godot/* $HOME/.local/share/godot/

          rm -rf ../build && mkdir ../build
          godot --headless --export-release 'Web' project.godot 2>&1 | tee log.txt
          grep "ERROR" log.txt && exit 1
          ls -l ../build
